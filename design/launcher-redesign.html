<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuickBox 启动器 · 重设计稿</title>
<style>
  /* ========== 设计令牌 ========== */
  :root {
    --font: "Inter", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;

    --desk: radial-gradient(1200px 700px at 20% 10%, #dfe3ff 0%, transparent 60%),
            radial-gradient(900px 600px at 90% 90%, #ffe4f1 0%, transparent 55%), #eef0f6;
    --win: rgba(255, 255, 255, 0.86);
    --surface: #ffffff;
    --surface-2: #f6f7fa;
    --hover: #f1f2f6;
    --border: rgba(20, 22, 40, 0.07);
    --border-strong: rgba(20, 22, 40, 0.12);
    --text: #17181c;
    --text-2: #5d606b;
    --text-3: #9a9ca6;
    --accent: #5b5cf0;
    --accent-soft: rgba(91, 92, 240, 0.1);
    --accent-text: #4b4cdc;
    --sel: rgba(91, 92, 240, 0.09);
    --kbd-bg: #ffffff;
    --kbd-border: rgba(20, 22, 40, 0.14);
    --shadow-win: 0 30px 80px -20px rgba(30, 32, 70, 0.35), 0 0 0 1px rgba(20, 22, 40, 0.06);
    --shadow-pop: 0 18px 50px -12px rgba(30, 32, 70, 0.35), 0 0 0 1px rgba(20, 22, 40, 0.08);
    --radius-win: 16px;
  }
  [data-theme="dark"] {
    --desk: radial-gradient(1200px 700px at 20% 10%, #23264a 0%, transparent 60%),
            radial-gradient(900px 600px at 90% 90%, #3a1f35 0%, transparent 55%), #121318;
    --win: rgba(28, 29, 35, 0.9);
    --surface: #202127;
    --surface-2: #1a1b20;
    --hover: #26272e;
    --border: rgba(255, 255, 255, 0.06);
    --border-strong: rgba(255, 255, 255, 0.1);
    --text: #ecedf1;
    --text-2: #a3a5b0;
    --text-3: #6c6e7a;
    --accent: #7c7dff;
    --accent-soft: rgba(124, 125, 255, 0.16);
    --accent-text: #a5a6ff;
    --sel: rgba(124, 125, 255, 0.14);
    --kbd-bg: #2a2b33;
    --kbd-border: rgba(255, 255, 255, 0.1);
    --shadow-win: 0 30px 80px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
    --shadow-pop: 0 18px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    background: var(--desk);
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }

  /* ========== 窗口 ========== */
  .window {
    width: 1040px;
    height: 680px;
    display: flex;
    flex-direction: column;
    background: var(--win);
    backdrop-filter: blur(30px) saturate(1.4);
    border-radius: var(--radius-win);
    box-shadow: var(--shadow-win);
    overflow: hidden;
    position: relative;
  }

  /* 顶栏：可拖拽区域，信息量压到最低 */
  .titlebar {
    height: 44px;
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 14px;
  }
  .traffic { display: flex; gap: 8px; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .traffic i:nth-child(1) { background: #ff5f57; }
  .traffic i:nth-child(2) { background: #febc2e; }
  .traffic i:nth-child(3) { background: #28c840; }

  .tabs {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
  }
  .tab {
    height: 26px;
    padding: 0 14px;
    border-radius: 6px;
    color: var(--text-2);
    font-weight: 500;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.is-active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 0 0 1px var(--border);
  }
  .titlebar-right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; color: var(--text-3); font-size: 12px; }
  .icon-btn {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 7px;
    color: var(--text-2);
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  /* ========== 搜索区 ========== */
  .search {
    flex: none;
    margin: 4px 14px 0;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .search svg { color: var(--text-3); flex: none; }
  .search input {
    flex: 1;
    border: 0;
    outline: 0;
    background: none;
    font: inherit;
    font-size: 17px;
    color: var(--text);
  }
  .search input::placeholder { color: var(--text-3); }
  .search-meta { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 12px; }

  /* 分类筛选 */
  .filters {
    flex: none;
    display: flex;
    gap: 6px;
    padding: 12px 14px 10px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chip {
    height: 28px;
    padding: 0 11px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    color: var(--text-2);
    border: 1px solid var(--border);
    background: var(--surface);
    white-space: nowrap;
    transition: all 0.15s;
  }
  .chip:hover { color: var(--text); border-color: var(--border-strong); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip .count { color: var(--text-3); font-size: 11px; }
  .chip.is-active {
    background: var(--text);
    border-color: var(--text);
    color: var(--surface);
  }
  .chip.is-active .count { color: var(--surface); opacity: 0.6; }

  /* ========== 主体 ========== */
  .body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 340px;
    border-top: 1px solid var(--border);
  }
  .list-pane {
    overflow-y: auto;
    padding: 10px 8px 16px 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
  }
  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 8px 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-3);
  }
  .section-title .hint { font-weight: 400; letter-spacing: 0; }

  /* 常用工具磁贴 */
  .tiles {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 0 2px 6px;
  }
  .tile {
    position: relative;
    height: 84px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.15s;
  }
  .tile:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .tile.is-selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tile-name { font-weight: 600; font-size: 13px; }
  .tile-key {
    position: absolute;
    top: 10px; right: 10px;
    font-size: 10px;
    color: var(--text-3);
    font-family: var(--mono);
  }
  .tile.is-add {
    border-style: dashed;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-3);
    flex-direction: row;
    background: transparent;
  }
  .tile.is-add:hover { color: var(--accent-text); border-color: var(--accent); }

  /* 列表项 */
  .row {
    width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 10px;
    border-radius: 10px;
    text-align: left;
    position: relative;
  }
  .row:hover { background: var(--hover); }
  .row.is-selected { background: var(--sel); }
  .row-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .row-name { font-weight: 500; font-size: 13.5px; white-space: nowrap; }
  .row-desc { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-name mark { background: none; color: var(--accent-text); font-weight: 700; }
  .row-side { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 11.5px; }
  .row-star { color: #f5a524; }
  .row .enter-hint { display: none; }
  .row.is-selected .enter-hint { display: inline-flex; }
  .row.is-selected .row-type { display: none; }

  /* 工具图标：按分类着色 */
  .tool-icon {
    width: 30px; height: 30px;
    flex: none;
    display: grid; place-items: center;
    border-radius: 8px;
    color: #fff;
    background: var(--c);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .tool-icon.lg { width: 52px; height: 52px; border-radius: 14px; }
  .tool-icon.lg svg { width: 26px; height: 26px; }

  .empty {
    display: grid;
    place-items: center;
    gap: 8px;
    padding: 80px 0;
    color: var(--text-3);
    text-align: center;
  }

  /* ========== 详情面板 ========== */
  .detail-pane {
    border-left: 1px solid var(--border);
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .detail-scroll { flex: 1; overflow-y: auto; padding: 22px 20px 16px; }
  .detail-head { display: flex; gap: 14px; align-items: center; }
  .detail-name { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .detail-cat { margin-top: 4px; display: flex; gap: 6px; align-items: center; color: var(--text-3); font-size: 12px; }
  .detail-desc { margin-top: 14px; color: var(--text-2); line-height: 1.65; }

  .preview {
    margin-top: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .preview-label {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--text-3);
    border-bottom: 1px solid var(--border);
  }
  .preview-io { padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.6; word-break: break-all; }
  .preview-io .in { color: var(--text-2); }
  .preview-io .arrow { color: var(--text-3); margin: 4px 0; }
  .preview-io .out { color: var(--accent-text); }

  .meta { margin-top: 18px; }
  .meta-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px dashed var(--border-strong);
    font-size: 12.5px;
  }
  .meta-row:last-child { border-bottom: 0; }
  .meta-row span:first-child { color: var(--text-3); }

  .detail-actions {
    flex: none;
    padding: 12px 16px 14px;
    border-top: 1px solid var(--border);
    display: grid;
    gap: 6px;
  }
  .btn-primary {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 6px 16px -6px var(--accent);
    transition: filter 0.15s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary kbd { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.25); color: #fff; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btn-ghost {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border-radius: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-size: 12.5px;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }
  .btn-ghost.is-on { color: #e09412; }

  /* ========== 底栏 ========== */
  .footer {
    flex: none;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-top: 1px solid var(--border);
    color: var(--text-3);
    font-size: 12px;
  }
  .footer-group { display: flex; align-items: center; gap: 14px; }
  .hint { display: inline-flex; align-items: center; gap: 6px; }

  kbd {
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    display: inline-grid;
    place-items: center;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
    background: var(--kbd-bg);
    border: 1px solid var(--kbd-border);
    border-bottom-width: 2px;
    border-radius: 5px;
  }

  /* ========== 动作菜单 Ctrl+K ========== */
  .action-menu {
    position: absolute;
    right: 16px;
    bottom: 48px;
    width: 300px;
    padding: 6px;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-pop);
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    pointer-events: none;
    transition: all 0.16s ease;
    z-index: 10;
  }
  .action-menu.is-open { opacity: 1; transform: none; pointer-events: auto; }
  .action-menu-title { padding: 8px 10px 6px; font-size: 11px; color: var(--text-3); }
  .action-item {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 8px;
    text-align: left;
  }
  .action-item:hover, .action-item.is-selected { background: var(--sel); }
  .action-item span { flex: 1; }
  .action-item svg { color: var(--text-3); }
  .action-sep { height: 1px; margin: 4px 6px; background: var(--border); }

  /* ========== Toast ========== */
  .toast {
    position: absolute;
    left: 50%;
    bottom: 56px;
    transform: translate(-50%, 10px);
    padding: 8px 14px;
    background: var(--text);
    color: var(--surface);
    border-radius: 999px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s;
    z-index: 20;
  }
  .toast.is-show { opacity: 1; transform: translate(-50%, 0); }

  /* 设计稿说明 */
  .note {
    position: fixed;
    left: 20px;
    bottom: 16px;
    font-size: 12px;
    color: var(--text-3);
  }
</style>
</head>
<body>

<!-- 启动器窗口 -->
<div class="window">

  <!-- 顶栏 -->
  <header class="titlebar">
    <div class="traffic"><i></i><i></i><i></i></div>
    <nav class="tabs">
      <button class="tab is-active">启动器</button>
      <button class="tab">插件</button>
      <button class="tab">设置</button>
    </nav>
    <div class="titlebar-right">
      <span class="hint">唤起 <kbd>Alt</kbd><kbd>Space</kbd></span>
      <button class="icon-btn" id="themeBtn" title="切换主题">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <!-- 搜索框 -->
  <label class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" placeholder="搜索工具、命令或插件…" autocomplete="off" autofocus />
    <span class="search-meta"><span id="resultCount"></span><kbd>Esc</kbd></span>
  </label>

  <!-- 分类筛选 -->
  <div class="filters" id="filters"></div>

  <!-- 主体 -->
  <main class="body">
    <section class="list-pane" id="listPane"></section>
    <aside class="detail-pane" id="detailPane"></aside>
  </main>

  <!-- 底栏 -->
  <footer class="footer">
    <div class="footer-group">
      <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span class="hint"><kbd>Tab</kbd> 切换分类</span>
      <span class="hint"><kbd>Ctrl</kbd><kbd>1-4</kbd> 常用</span>
    </div>
    <div class="footer-group">
      <span class="hint"><kbd>↵</kbd> 打开</span>
      <span class="hint"><kbd>Ctrl</kbd><kbd>K</kbd> 更多动作</span>
    </div>
  </footer>

  <!-- 动作菜单 -->
  <div class="action-menu" id="actionMenu"></div>

  <!-- 提示 -->
  <div class="toast" id="toast"></div>
</div>

<div class="note">QuickBox 启动器重设计稿 · 可直接键盘操作</div>

    pin: '<path d="M12 17v5M9 10.8V4h6v6.8l3 3.2H6z"/>',
    window: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'
  };

  /** 分类定义：每个分类一种颜色，便于扫视 */
  const CATEGORIES = [
    { id: 'all', name: '全部' },
    { id: 'encode', name: '编码转换', color: '#5b5cf0' },
    { id: 'format', name: '格式化', color: '#0ea5a4' },
    { id: 'crypto', name: '加密安全', color: '#e5484d' },
    { id: 'time', name: '时间日期', color: '#f59e0b' },
    { id: 'network', name: '网络', color: '#3b82f6' },
    { id: 'system', name: '系统', color: '#64748b' }
  ];

  /** 工具数据 */
  const TOOLS = [
    { id: 'port', name: '端口占用清理', desc: '查找并终止占用端口的进程，解决 EADDRINUSE', cat: 'system', icon: 'port', fav: true, uses: 128, pin: 1,
      preview: { label: '示例', in: ':3000', out: 'node.exe  PID 18244  →  已终止' } },
    { id: 'ts', name: '时间戳转换', desc: '时间戳与日期互转，支持秒 / 毫秒', cat: 'time', icon: 'clock', fav: true, uses: 96, pin: 2,
      preview: { label: '当前时间', in: '1791961560', out: '2026-10-14 15:06:00 (UTC+8)' } },
    { id: 'jwt', name: 'JWT 解析器', desc: '解析 Header / Payload，校验过期时间', cat: 'crypto', icon: 'key', fav: true, uses: 71, pin: 3,
      preview: { label: '示例', in: 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0…', out: '{ "alg": "HS256" } · { "sub": "1" }' } },
    { id: 'json', name: 'JSON 工具', desc: '格式化、压缩并校验 JSON', cat: 'format', icon: 'braces', uses: 64, pin: 4,
      preview: { label: '示例', in: '{"a":1,"b":[1,2]}', out: '{\n  "a": 1,\n  "b": [1, 2]\n}' } },
    { id: 'base64', name: 'Base64 编解码', desc: '编码和解码 Base64，支持图片', cat: 'encode', icon: 'code', uses: 52,
      preview: { label: '示例', in: 'QuickBox', out: 'UXVpY2tCb3g=' } },
    { id: 'uuid', name: 'UUID 生成器', desc: '批量生成随机 UUID v4', cat: 'encode', icon: 'fingerprint', uses: 40,
      preview: { label: '即时生成', in: 'v4 × 1', out: '3f2a9c1e-7b4d-4e8a-9f01-2c6d8e5b7a10' } },
    { id: 'hash', name: 'Hash 工具', desc: '生成 SHA-1、SHA-256 和 SHA-512 摘要', cat: 'crypto', icon: 'hash', uses: 33,
      preview: { label: 'SHA-256', in: 'hello', out: '2cf24dba5fb0a30e26e83b2ac5b9e29e…' } },
    { id: 'url', name: 'URL 编解码', desc: 'URL 编码、解码与参数解析', cat: 'encode', icon: 'link', uses: 29,
      preview: { label: '示例', in: 'a=你好&b=1', out: 'a=%E4%BD%A0%E5%A5%BD&b=1' } },
    { id: 'regex', name: '正则测试', desc: '实时匹配、分组高亮与常用正则', cat: 'format', icon: 'regex', uses: 22,
      preview: { label: '示例', in: '/\\d{3}-\\d{4}/g', out: '匹配 2 处：010-1234, 021-5678' } },
    { id: 'jwtkey', name: 'JWT 密钥生成', desc: '生成 HS / RS 系列签名密钥', cat: 'crypto', icon: 'lock', uses: 12,
      preview: { label: 'HS256', in: '256 bit', out: 'k9F2…Qx7A (base64url)' } },
    { id: 'cidr', name: 'CIDR 计算器', desc: '子网掩码、网段范围与可用主机数', cat: 'network', icon: 'network', uses: 18,
      preview: { label: '示例', in: '192.168.1.0/24', out: '192.168.1.1 – 192.168.1.254 · 254 台' } },
    { id: 'cookie', name: 'Cookie 解析', desc: '解析 Cookie / Set-Cookie 字符串', cat: 'network', icon: 'cookie', uses: 9,
      preview: { label: '示例', in: 'sid=abc; Path=/; HttpOnly', out: 'sid = abc · Path=/ · HttpOnly' } },
    { id: 'yaml', name: 'YAML ⇄ Properties', desc: 'YAML 与 Properties 配置互转', cat: 'format', icon: 'file', uses: 15,
      preview: { label: '示例', in: 'server:\n  port: 8080', out: 'server.port=8080' } },
    { id: 'schema', name: 'JSON Schema', desc: '根据 JSON 生成 Schema 并校验', cat: 'format', icon: 'shield', uses: 6,
      preview: { label: '示例', in: '{"id":1}', out: '{ "type": "object", "properties": { "id": … } }' } },
    { id: 'chmod', name: 'chmod 计算器', desc: 'Linux 权限数字与符号互转', cat: 'system', icon: 'lock', uses: 8,
      preview: { label: '示例', in: '755', out: 'rwxr-xr-x' } },
    { id: 'cheat', name: '命令速查', desc: 'Git、Docker、Linux 常用命令', cat: 'system', icon: 'terminal', uses: 27,
      preview: { label: '示例', in: 'git undo', out: 'git reset --soft HEAD~1' } }
  ];

  /** 当前状态 */
  const state = {
    query: '',
    cat: 'all',
    selected: 0,
    visible: [],
    menuOpen: false,
    menuIndex: 0
  };

  const $ = (sel) => document.querySelector(sel);
  const svg = (name, size = 16) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
  const catOf = (id) => CATEGORIES.find((c) => c.id === id);
  const toolIcon = (t, lg) =>
    `<span class="tool-icon${lg ? ' lg' : ''}" style="--c:${catOf(t.cat).color}">${svg(t.icon, 16)}</span>`;

  /**
   * 高亮匹配字符
   * @param {string} text 原文本
   * @param {string} q 搜索词
   */
  function highlight(text, q) {
    if (!q) return text;
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return text;
    return text.slice(0, i) + '<mark>' + text.slice(i, i + q.length) + '</mark>' + text.slice(i + q.length);
  }

  function renderFilters() {
    $('#filters').innerHTML = CATEGORIES.map((c) => {
      const count = c.id === 'all' ? TOOLS.length : TOOLS.filter((t) => t.cat === c.id).length;
      return `<button class="chip${state.cat === c.id ? ' is-active' : ''}" data-cat="${c.id}">
        ${c.color ? `<span class="dot" style="background:${c.color}"></span>` : ''}
        ${c.name}<span class="count">${count}</span></button>`;
    }).join('');
  }

  function renderList() {
    const q = state.query.trim().toLowerCase();
    let tools = TOOLS.filter((t) => state.cat === 'all' || t.cat === state.cat);
    if (q) tools = tools.filter((t) => (t.name + t.desc + t.id).toLowerCase().includes(q));

    const showTiles = !q && state.cat === 'all';
    const pinned = TOOLS.filter((t) => t.pin).sort((a, b) => a.pin - b.pin);
    const rest = showTiles ? tools.filter((t) => !t.pin) : tools.sort((a, b) => b.uses - a.uses);

    state.visible = showTiles ? [...pinned, ...rest] : rest;
    state.selected = Math.min(state.selected, Math.max(state.visible.length - 1, 0));
    $('#resultCount').textContent = `${state.visible.length} 个工具`;

    if (!state.visible.length) {
      $('#listPane').innerHTML = `<div class="empty">${svg('search', 28)}
        <div>没有找到「${state.query}」</div>
        <div style="font-size:12px">按 <kbd>Enter</kbd> 去插件市场搜索</div></div>`;
      renderDetail();
      return;
    }

    let html = '';
    let idx = 0;
    if (showTiles) {
      html += `<div class="section-title"><span>常用</span><span class="hint">拖拽排序</span></div><div class="tiles">`;
      html += pinned.map((t) => {
        const i = idx++;
        return `<button class="tile${i === state.selected ? ' is-selected' : ''}" data-idx="${i}">
          ${toolIcon(t)}<span class="tile-key">Ctrl ${t.pin}</span>
          <span class="tile-name">${t.name}</span></button>`;
      }).join('');
      html += `</div>`;
    }

    html += `<div class="section-title"><span>${q ? '搜索结果' : showTiles ? '全部工具' : catOf(state.cat).name}</span>
      <span class="hint">${q ? '按相关度' : '按使用频率'}</span></div>`;
    html += rest.map((t) => {
      const i = idx++;
      return `<button class="row${i === state.selected ? ' is-selected' : ''}" data-idx="${i}">
        ${toolIcon(t)}
        <span class="row-main"><span class="row-name">${highlight(t.name, q)}</span><span class="row-desc">${t.desc}</span></span>
        <span class="row-side">
          ${t.fav ? `<span class="row-star">${svg('star', 13)}</span>` : ''}
          <span class="row-type">${catOf(t.cat).name}</span>
          <span class="enter-hint"><kbd>↵</kbd></span>
        </span></button>`;
    }).join('');

    $('#listPane').innerHTML = html;
    renderDetail();
  }

  function renderDetail() {
    const t = state.visible[state.selected];
    if (!t) { $('#detailPane').innerHTML = ''; return; }
    const c = catOf(t.cat);
    $('#detailPane').innerHTML = `
      <div class="detail-scroll">
        <div class="detail-head">
          ${toolIcon(t, true)}
          <div>
            <div class="detail-name">${t.name}</div>
            <div class="detail-cat"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:${c.color}"></span>${c.name} · 官方</div>
          </div>
        </div>
        <p class="detail-desc">${t.desc}</p>
        <div class="preview">
          <div class="preview-label"><span>${t.preview.label}</span><span>预览</span></div>
          <div class="preview-io">
            <div class="in">${t.preview.in.replace(/\n/g, '<br>').replace(/ /g, '&nbsp;')}</div>
            <div class="arrow">↓</div>
            <div class="out">${t.preview.out.replace(/\n/g, '<br>').replace(/ /g, '&nbsp;')}</div>
          </div>
        </div>
        <div class="meta">
          <div class="meta-row"><span>打开方式</span><span>独立视图</span></div>
          <div class="meta-row"><span>使用次数</span><span>${t.uses} 次</span></div>
          <div class="meta-row"><span>关键词</span><span style="font-family:var(--mono)">${t.id}</span></div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn-primary" data-act="open">打开 ${t.name} <kbd>↵</kbd></button>
        <div class="btn-row">
          <button class="btn-ghost${t.fav ? ' is-on' : ''}" data-act="fav">${svg('star', 14)}${t.fav ? '已收藏' : '收藏'}</button>
          <button class="btn-ghost" data-act="menu">更多 <kbd>Ctrl</kbd><kbd>K</kbd></button>
        </div>
      </div>`;
  }

  /** 动作菜单项 */
  const MENU = [
    { id: 'open', name: '打开工具', icon: 'window', key: '↵' },
    { id: 'fav', name: '收藏 / 取消收藏', icon: 'star', key: 'Ctrl D' },
    { id: 'pin', name: '固定到常用', icon: 'pin', key: 'Ctrl P' },
    { id: 'copy', name: '复制启动命令', icon: 'copy', key: 'Ctrl C' },
    { sep: true },
    { id: 'setting', name: '插件设置', icon: 'gear', key: 'Ctrl ,' }
  ];

  function renderMenu() {
    const t = state.visible[state.selected];
    let i = 0;
    $('#actionMenu').innerHTML = `<div class="action-menu-title">${t ? t.name : ''}</div>` +
      MENU.map((m) => {
        if (m.sep) return '<div class="action-sep"></div>';
        const cur = i++;
        return `<button class="action-item${cur === state.menuIndex ? ' is-selected' : ''}" data-menu="${m.id}">
          ${svg(m.icon, 15)}<span>${m.name}</span>${m.key.split(' ').map((k) => `<kbd>${k}</kbd>`).join('')}</button>`;
      }).join('');
    $('#actionMenu').classList.toggle('is-open', state.menuOpen);
  }

  function toggleMenu(open = !state.menuOpen) {
    state.menuOpen = open;
    state.menuIndex = 0;
    renderMenu();
  }

  let toastTimer;
  /**
   * 显示轻提示
   * @param {string} msg 提示内容
   */
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('is-show'), 1400);
  }

  /**
   * 执行动作
   * @param {string} act 动作 id
   */
  function runAction(act) {
    const t = state.visible[state.selected];
    if (!t) return;
    toggleMenu(false);
    if (act === 'open') return toast(`正在打开「${t.name}」`);
    if (act === 'fav') { t.fav = !t.fav; renderList(); return toast(t.fav ? '已加入收藏' : '已取消收藏'); }
    if (act === 'pin') return toast('已固定到常用');
    if (act === 'copy') return toast(`已复制：quickbox://${t.id}`);
    toast('打开插件设置');
  }

  function select(i) {
    if (!state.visible.length) return;
    state.selected = (i + state.visible.length) % state.visible.length;
    document.querySelectorAll('[data-idx]').forEach((el) => {
      el.classList.toggle('is-selected', +el.dataset.idx === state.selected);
    });
    document.querySelector(`[data-idx="${state.selected}"]`)?.scrollIntoView({ block: 'nearest' });
    renderDetail();
  }

  /* ========== 事件绑定 ========== */
  $('#searchInput').addEventListener('input', (e) => {
    state.query = e.target.value;
    state.selected = 0;
    renderList();
  });

  $('#filters').addEventListener('click', (e) => {
    const chip = e.target.closest('[data-cat]');
    if (!chip) return;
    state.cat = chip.dataset.cat;
    state.selected = 0;
    renderFilters();
    renderList();
  });

  $('#listPane').addEventListener('click', (e) => {
    const item = e.target.closest('[data-idx]');
    if (item) select(+item.dataset.idx);
  });
  $('#listPane').addEventListener('dblclick', (e) => {
    if (e.target.closest('[data-idx]')) runAction('open');
  });

  $('#detailPane').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    btn.dataset.act === 'menu' ? toggleMenu() : runAction(btn.dataset.act);
  });

  $('#actionMenu').addEventListener('click', (e) => {
    const item = e.target.closest('[data-menu]');
    if (item) runAction(item.dataset.menu);
  });

  $('#themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });

  document.addEventListener('keydown', (e) => {
    const menuItems = MENU.filter((m) => !m.sep);

    // 动作菜单打开时，方向键在菜单内移动
    if (state.menuOpen) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const d = e.key === 'ArrowDown' ? 1 : -1;
        state.menuIndex = (state.menuIndex + d + menuItems.length) % menuItems.length;
        return renderMenu();
      }
      if (e.key === 'Enter') { e.preventDefault(); return runAction(menuItems[state.menuIndex].id); }
      if (e.key === 'Escape') { e.preventDefault(); return toggleMenu(false); }
    }

    if (e.ctrlKey && e.key.toLowerCase() === 'k') { e.preventDefault(); return toggleMenu(); }
    if (e.ctrlKey && e.key.toLowerCase() === 'd') { e.preventDefault(); return runAction('fav'); }
    if (e.ctrlKey && /^[1-4]$/.test(e.key)) {
      e.preventDefault();
      const t = TOOLS.find((x) => x.pin === +e.key);
      return toast(`正在打开「${t.name}」`);
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); return select(state.selected + 1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); return select(state.selected - 1); }
    if (e.key === 'Enter') { e.preventDefault(); return runAction('open'); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const i = CATEGORIES.findIndex((c) => c.id === state.cat);
      const d = e.shiftKey ? -1 : 1;
      state.cat = CATEGORIES[(i + d + CATEGORIES.length) % CATEGORIES.length].id;
      state.selected = 0;
      renderFilters();
      return renderList();
    }
    if (e.key === 'Escape') {
      const input = $('#searchInput');
      if (input.value) { input.value = ''; state.query = ''; renderList(); }
    }
    if (document.activeElement !== $('#searchInput') && e.key.length === 1 && !e.ctrlKey) $('#searchInput').focus();
  });

  renderFilters();
  renderList();
  renderMenu();
</script>
</body>
</html>
