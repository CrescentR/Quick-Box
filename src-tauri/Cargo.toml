[package]
name = "quickbox"
version = "0.1.0"
description = "A lightweight cross-platform desktop launcher"
authors = ["QuickBox"]
edition = "2021"

[lib]
name = "quickbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
thiserror = "2"
